[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slakebind"
version = "1.0.0"
description = "Tannin-to-hide ratio calculator, lime bath soak timer and bark source ledger - one Python file, standard library only."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Slakebind" }]
keywords = ["tanning", "leather", "bark", "tannin", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
# Slakebind is standard-library only. This list is intentionally empty.
dependencies = []

[project.scripts]
slakebind = "slakebind:main"

[project.optional-dependencies]
# Only needed to run the test suite; the tool itself needs nothing.
dev = ["pytest==9.1.1"]

[tool.setuptools]
py-modules = ["slakebind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
